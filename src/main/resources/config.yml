# Режим сброса:
#   blocks - удаляются только блоки, которые поставили игроки
#   world  - весь мир заменяется бэкапом из backup-dir
reset-mode: blocks

# Миры-данжи, которые нужно сбрасывать.
# Пустой список = все загруженные миры (кроме исключённых и основного).
managed-worlds: []

# Миры, которые НИКОГДА не сбрасываются (аванпост)
excluded-worlds:
  - outpost

# Каждые сколько минут сбрасывать данж
reset-interval-minutes: 20

# Как часто проверять миры (секунды)
check-interval-seconds: 30

# blocks: сбрасывать только когда в данже нет игроков
require-empty: true

# blocks: сколько блоков убирать за тик
blocks-per-tick: 200

# world: сбрасывать только данжи, в которых кто-то был с прошлого сброса
only-if-visited: true

# world: папка с бэкапами
backup-dir: "world-backups"

# world: автоматически создавать бэкап, если его ещё нет
auto-backup-missing: true.
